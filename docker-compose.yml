services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reforgerpanel
      POSTGRES_PASSWORD: reforgerpanel
      POSTGRES_DB: reforgerpanel
    ports:
      - "5432:5432"
    volumes:
      - reforgerpanel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reforgerpanel -d reforgerpanel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reforgerpanel_pg:
